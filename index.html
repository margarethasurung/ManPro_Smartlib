<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f2">
  <link rel="manifest" href="manifest.json">
  <meta name="description" content="SmartLib — perpustakaan digital dan ruang tumbuh untuk setiap pembaca.">
  <title>SmartLib — Temukan cerita berikutnya</title>
  <link rel="stylesheet" href="styles.css?v=vertical-layout-1">
</head>
<body>
  <a class="screen-reader" href="#main">Lewati ke konten</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#/home" aria-label="SmartLib beranda"><span class="brand-mark">S</span><span>SmartLib<small>Ruang tumbuh bersama</small></span></a>
      <nav class="nav" id="nav" aria-label="Navigasi utama">
        <button data-route="home">Beranda</button><button data-route="catalog">Jelajahi</button><button data-route="rooms">Booking ruang</button><button data-route="loans">Peminjaman</button><button data-route="card">Kartu digital</button><button data-route="ai">Pustakawan AI</button><button data-route="events">Acara</button>
      </nav>
      <div class="top-actions">
        <div class="profile-control">
          <button class="avatar" id="profile-button" aria-label="Masuk atau buka menu akun" aria-haspopup="true" aria-expanded="false">?</button>
          <div class="profile-menu" id="profile-menu" role="menu" hidden>
            <p class="profile-menu-name" id="profile-menu-name">Belum masuk</p>
            <button data-nav="profile" role="menuitem">Profil</button>
            <button data-nav="card" role="menuitem">Kartu digital</button>
            <button data-nav="favorites" role="menuitem">Favorit</button>
            <button data-nav="admin" id="profile-admin" role="menuitem" hidden>Panel admin</button>
            <button data-nav="login" id="profile-login" role="menuitem">Masuk</button>
            <button data-nav="register" id="profile-register" role="menuitem">Daftar</button>
            <button id="profile-logout" role="menuitem" hidden>Keluar</button>
          </div>
        </div>
        <button class="mobile-menu" id="menu-button" aria-label="Buka menu" aria-expanded="false">☰</button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="footer"></footer>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="overlay-root"></div>
  <script type="module" src="app.js"></script>
  <script>if("serviceWorker" in navigator && location.protocol !== "file:") window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(error=>console.error("Service worker tidak dapat dipasang",error)));</script>
</body>
</html>
